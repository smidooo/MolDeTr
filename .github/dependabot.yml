# Dependency updates, deliberately quiet.
#
# The failure mode this configuration is written against is alert fatigue, not missed updates. This
# project's dependency tree is torch-sized: ungrouped, weekly, per-dependency PRs would produce a
# steady stream of noise against a repository whose code is frozen at a paper release, and a
# maintainer who learns to close Dependabot PRs unread is strictly worse off than one who never
# enabled it. Everything below trades update latency for signal.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Actions are pinned by tag in the workflows and are the supply-chain surface most worth keeping
    # current -- a compromised action runs with the workflow's token. Grouped into one PR so that
    # staying current costs one review, not six.
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Two groups rather than one, split by what a failure would mean:
    #   `dev-tooling` — ruff/mypy/pytest and friends. Breakage here is loud, immediate and local to
    #   CI, so these can move together and often.
    #   `runtime` — everything the published package actually depends on. A bump here can change
    #   model behaviour, so it wants its own PR and its own nightly result before merging.
    groups:
      dev-tooling:
        patterns: ["pytest*", "ruff", "mypy", "hypothesis", "tomli", "nbmake", "axe-*"]
      runtime:
        patterns: ["*"]
        exclude-patterns: ["pytest*", "ruff", "mypy", "hypothesis", "tomli", "nbmake", "axe-*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    # torch and fastai are pinned against each other for a reason recorded in pyproject
    # (`fastai>=2.7,<2.9` — see the measured `L.starmap` note there; the older wording here and in
    # pyproject named the wrong version pair), and the shipped checkpoint was trained against a
    # specific stack. An automated major bump of either is not a dependency update, it is a
    # decision about whether the published model still loads. Those two stay manual.
    #
    # `versions` AND `update-types` on each entry, because they catch different things and only
    # together cover the case that actually got through. `update-types` classifies a *version*
    # change and therefore does not see a range WIDENING: on 2026-08-10 the grouped runtime PR moved
    # the fastai ceiling `<2.8` -> `<2.9` without tripping the semver-minor ignore, because widening
    # a specifier is not a version update. `versions` is matched against the candidate version
    # itself, so it fires regardless of how Dependabot classified the change. That bump turned out
    # to be correct, but it arrived unreviewed by a rule written to review exactly it.
    #
    # torch previously ignored semver-major only, which was an asymmetry with no stated reason: a
    # torch *minor* sailed through while the same class of bump for fastai was blocked. Nothing in
    # CI can judge either -- no lane exercises `learner.load()` (see CHANGELOG) -- so they are now
    # gated the same way.
    #
    # Stated cost, not hidden: ignoring torch minors also suppresses a torch security bump that
    # arrives as a minor. That is a deliberate trade for a repository whose code is frozen at a
    # paper release and whose checkpoint pins the stack; do not assume `security.yml` compensates,
    # because its `pip-audit` step is report-only and currently reports on an editable self-install.
    ignore:
      - dependency-name: torch
        versions: [">=3"]
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: fastai
        versions: [">=2.9"]
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
