name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.12 added 2026-08-07 after checking wheel availability rather than assuming it: every
        # dependency in every extras group has a cp312 wheel at a version this project's constraints
        # permit, on all three OSes, and the development venv is already 3.12. `tests/test_public_api.py`
        # asserts this list and the PyPI classifiers stay in agreement, so adding a leg here without
        # advertising it (or vice versa) fails.
        #
        # 3.13 is deliberately NOT here. It resolves today, but with zero slack: `fastai>=2.7,<2.8`
        # pins `torch<2.7`, and cp313 torch wheels for Windows/macOS start at 2.6.0 — so torch 2.6.0
        # is the *only* version satisfying floor ∩ fastai ceiling ∩ 3-OS cp313. One upstream patch
        # tightening fastai's torch ceiling flips that to unbuildable with no change here. Adding it
        # would need this leg to also assert the resolved torch version, the way `gradio-floor`
        # asserts `gradio.__version__`, or it silently degrades into a duplicate of 3.12.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,app]"
      - name: Lint
        # app.py + app_ui/ are the GUI hub and were previously unlinted in CI entirely.
        run: ruff check moldetr scripts tests app.py app_ui
      - name: Format check
        # Measured before adding: 24 files would have been reformatted, so this step was red on
        # arrival until `[tool.ruff.format] exclude` in pyproject was widened. 18 of those 24 are the
        # frozen training stack (model/, loss/, learner/, dataloader/, scripts/train.py) whose shape
        # must keep matching a published checkpoint and whose content is provenance evidence; the
        # other 6 were test files and were reformatted. Rationale for each exclusion lives next to
        # the list in pyproject, not here.
        run: ruff format --check moldetr scripts tests app.py app_ui
      - name: Type check
        # Scope and rationale live in pyproject's [tool.mypy]: this covers the pure-NumPy public
        # surface that py.typed's promise is actually actionable for, not the whole package.
        run: mypy
      - name: Smoke test
        run: python scripts/quick_validation.py
      - name: Unit + scripts tests (no in-process server)
        env:
          MPLBACKEND: Agg
        # Coverage is measured on ONE leg only (see the `coverage` job below), not here: a hard
        # floor evaluated on six OS/Python combinations invites flaking on cross-platform branch
        # differences without adding signal about the code.
        run: pytest -q -rs -m "not e2e and not browser and not network"
      - name: Reproduce headline numbers (committed data, no weights)
        # NOTE: this reproduces the medians from `experimental_matched_pairs.json`, an already-matched
        # intermediate — "no checkpoint, GPU, or raw spectra required". It proves the arithmetic, not
        # that the model still produces those predictions. Closing that is the nightly job's job.
        run: python scripts/aggregate_experimental.py

  coverage:
    name: coverage (ratcheted)
    # A separate job rather than a flag on the matrix: the floor only needs measuring once, and
    # running it on every leg would multiply the cost of the slowest step for no extra information.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU PyTorch + app)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,app]"
      - name: Coverage
        env:
          MPLBACKEND: Agg
        # Floor is 78, one point under the 79 % measured 2026-08-07 — ratcheted against the real
        # number, never an aspirational one. What the remaining gap is made of, and why it must not
        # be closed by testing frozen training code or by omitting it, is documented in pyproject's
        # [tool.coverage.report]. Source and omit come from there too, so a local `pytest --cov`
        # measures the same thing this job does.
        run: pytest -q -rs -m "not e2e and not browser and not network" --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=78
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  package:
    name: built wheel installs and works
    # Every other job installs with `pip install -e .`, so nothing has ever exercised the artifact a
    # user actually gets. An editable install cannot detect a missing `py.typed`, a package-data glob
    # that drops the CUDA op sources, an unregistered console script, or a licence file that never
    # reaches dist-info -- the source tree supplies all of them regardless.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Metadata check
        run: twine check --strict dist/*
      - name: Install the wheel into a clean environment
        # No extras: this is the base install a `pip install moldetr` user gets, and the assertions
        # below must not depend on torch being present.
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/python -m pip install --upgrade pip
          /tmp/wheelenv/bin/python -m pip install dist/*.whl
      - name: Verify the INSTALLED package, not the source tree
        # This step is the whole point of the job and it is easy to write so that it proves nothing.
        # `cd /tmp` is load-bearing: run from the repo root and `import moldetr` resolves to ./moldetr
        # and every assertion below passes against the source tree while the wheel could be empty.
        #
        # That failure mode is not hypothetical here -- the repo root carries a stale, gitignored
        # `build/` directory, and `import build` resolves to it as a namespace package, which is
        # exactly how a probe during this job's design reported a package as installed when it was
        # not. So the first assertion is on `moldetr.__file__` itself: if it is not under
        # site-packages, nothing after it means anything.
        run: |
          cd /tmp
          /tmp/wheelenv/bin/python - <<'PY'
          import pathlib, moldetr
          location = pathlib.Path(moldetr.__file__).resolve()
          assert "site-packages" in location.parts, (
              f"moldetr resolved to {location}, not an installed copy -- this job is testing the "
              "source tree and would pass against an empty wheel"
          )
          root = location.parent
          assert (root / "py.typed").is_file(), (
              "py.typed is missing from the INSTALLED package; PEP 561 support is silently off for "
              "every downstream even though pyproject declares it as package-data"
          )
          print("installed at", root)
          PY
      - name: Verify the console script is registered and every subcommand answers
        # `moldetr` is the documented entry point. Only a real subprocess against an installed
        # distribution can catch a broken `console_scripts` mapping -- an in-process call to
        # `cli.main()` works even when the script was never generated.
        run: |
          cd /tmp
          /tmp/wheelenv/bin/moldetr --help
      - name: Verify the licence files reached dist-info
        # `THIRD_PARTY.md` sits at the repo root, so it is neither package-data nor matched by the
        # default licence globs; pyproject names it explicitly in `license-files`. A third-party
        # notice that reaches only people browsing GitHub has not reached the people who installed
        # the package, which is who the notice is for.
        run: |
          cd /tmp
          /tmp/wheelenv/bin/python - <<'PY'
          import pathlib, importlib.metadata as md
          files = md.files("moldetr") or []
          names = {pathlib.PurePath(str(f)).name for f in files}
          for required in ("LICENSE", "THIRD_PARTY.md"):
              assert required in names, f"{required} did not reach dist-info; got {sorted(names)[:40]}"
          print("licence files present:", sorted(n for n in names if n in {"LICENSE", "THIRD_PARTY.md"}))
          PY
      - name: Upload the distributions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

  onboarding:
    name: the README quickstart, run verbatim
    # README.md's "Try it in 2 minutes" block is a promise to a first-time reader, and nothing checked
    # it. The commands below are copied from that block rather than adapted -- if they drift, this job
    # must break, which is the entire value. It also asserts the three headline numbers the block
    # promises, so a change that silently moves them fails here as well as in the paper-medians guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exactly as the README says
        # The README does not tell a reader to preinstall CPU torch, so this job must not either --
        # doing so would test a smoother path than the one that is documented.
        run: pip install -e ".[dev]"
      - name: Run the documented command and check its promised output
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/aggregate_experimental.py | tee /tmp/quickstart.txt
          python - <<'PY'
          import pathlib, re, sys
          out = pathlib.Path("/tmp/quickstart.txt").read_text(encoding="utf-8")
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          promised = {"median |dd| = 0.90": r"median \|dd\| = 0\.90",
                      "median |dJ| = 0.20": r"median \|dJ\| = 0\.20",
                      "proton-count 93.5 %": r"proton-count accuracy \(overall\) = 93\.5 %"}
          missing = [label for label, pattern in promised.items() if not re.search(pattern, out)]
          if missing:
              sys.exit(f"the quickstart no longer prints: {missing}\n--- actual ---\n{out}")
          # The README block itself must keep quoting these numbers, or the job above is checking a
          # promise the README has stopped making.
          for token in ("0.90 Hz", "0.20 Hz", "93.5"):
              assert token in readme, f"README quickstart no longer promises {token}"
          print("quickstart reproduces the documented numbers")
          PY

  environment-file:
    name: environment.yml still solves
    # README.md:229-235 gives `conda env create -f environment.yml` as the PRIMARY install path, with
    # pip only as "if you prefer pip" -- and no job has ever used conda, so the first thing a new user
    # is told to run has never been validated. Solve-only rather than a full create: it catches the
    # realistic breakage (a renamed package, an unsatisfiable pin) in a fraction of the time, and a
    # full environment adds minutes to every PR for a path CI does not otherwise exercise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          activate-environment: ""
      - name: Solve the declared environment without creating it
        shell: bash -el {0}
        run: conda env create -f environment.yml --dry-run

  e2e:
    name: in-process e2e (gradio_client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU PyTorch + app)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,app]"
      - name: In-process e2e
        env:
          MPLBACKEND: Agg
        run: pytest -q -rs -m e2e

  browser-e2e:
    name: browser e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Chromium alone would not have caught: WebKit applying the stylesheet ~300 ms after the
      # element exists (which exposed a latent race in the branding assertions), Plotly's modebar
      # logo having no accessible name, or WebKit raising the benign ResizeObserver notice as an
      # uncaught pageerror. Engine differences in style timing and a11y-name computation are
      # exactly what a single-engine matrix cannot see.
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU PyTorch + app + browser)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,app,browser]"
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Browser e2e
        env:
          MPLBACKEND: Agg
        # Without traces/video a red leg gives only a stack trace, which is near-useless for a
        # DOM failure you cannot reproduce locally.
        # `-rs` because test_browser_a11y.py guards `axe_playwright_python` with importorskip and
        # is the only module holding axe assertions: without it, losing all of them to a broken
        # import shows up as the bare token `7 skipped` in a green step.
        run: >-
          pytest tests/e2e -m browser -q -rs
          --browser ${{ matrix.browser }}
          --tracing retain-on-failure
          --video retain-on-failure
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  gradio-floor:
    name: e2e + a11y at the declared gradio floor
    # Every other job resolves gradio unconstrained and therefore only ever exercises the newest
    # 6.x. That left `gradio>=6.21` in pyproject as a claim about a version CI never installed --
    # the same shape as the `numpy>=1.23` floor whose annotations only checked against the newest.
    # This job is the one place the declared floor is actually run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install at the declared floor, resolved in one pass
        # The pin sits in the SAME resolution as the extras, so pip solves `>=6.21,<7` and
        # `==6.21.0` together. A follow-up `pip install gradio==...` instead re-resolves against an
        # already-installed set: gradio still lands on 6.21.0, but its transitive deps can stay at
        # whatever the newest gradio pulled in -- a floor leg testing 6.21 inside a 6.22-shaped
        # environment. Hence the `pip check` below.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,app,browser]" "gradio==6.21.0"
          python -m playwright install --with-deps chromium
      - name: Confirm the environment is internally consistent
        # pip reports a conflicting install with an `ERROR:` line and still exits 0, which the
        # default `bash -e` cannot catch. Pinning gradio is what makes the resolver backtrack on
        # shared transitive deps in the first place, so this is the job where that matters most.
        run: pip check
      - name: Confirm the floor actually resolved
        # Cheap insurance against a future edit relaxing the pin: without this the job degrades
        # into a silent duplicate of `e2e` and nothing says so. Asserts `== 6.21.0` rather than a
        # prefix so the pin above and this literal fail loudly the moment they diverge.
        #
        # Read `gradio.__version__`, not `importlib.metadata`: `__version__` reports what the
        # imported package is, which is what the tests below actually exercise, whereas metadata
        # describes the installed distribution and can diverge from it.
        #
        # The axe import is here because it is the one thing in this job that can fail SILENTLY.
        # tests/e2e/test_browser_a11y.py:21 is the only module guarding `axe_playwright_python`
        # and the only one holding axe assertions, so a broken import skips all of them while the
        # other browser tests carry the step to exit 0 -- the job's stated purpose lost to the
        # token `7 skipped`. `axe-playwright-python` is pinned open against a fast-moving
        # `playwright`, so this is a matter of when, not whether.
        run: |
          python -c "import gradio,sys; v=gradio.__version__; print('gradio', v); sys.exit(0 if v == '6.21.0' else 1)"
          python -c "from axe_playwright_python.sync_playwright import Axe; from playwright.sync_api import Page; print('axe + playwright import OK')"
      - name: Unit tier at the floor
        env:
          MPLBACKEND: Agg
        # The sharpest gradio-facing tier, and the one the two steps below miss. tests/conftest.py
        # imports `app`, which imports gradio, so 13 modules reach it transitively -- and
        # tests/test_ui_graph.py pins `len(demo.blocks)` and `len(demo.fns)`, reads the private
        # `_id`, and exists to catch things like `api_name=False` serialising to the literal
        # "false". That is where a gradio-minor divergence actually surfaces. No browser and no
        # weights, so it is the cheapest step in the job.
        run: pytest -q -rs -m "not e2e and not browser and not network"
      - name: e2e at the floor
        env:
          MPLBACKEND: Agg
        run: pytest -q -rs -m e2e
      - name: chromium a11y at the floor
        env:
          MPLBACKEND: Agg
        # Chromium only, as the cheapest representative engine. The `browser-e2e` matrix above runs
        # three because engine differences in style timing and a11y-name computation are real; this
        # job varies the gradio version, not the engine, so a second and third would buy another
        # copy of the same signal.
        #
        # This step now DOES detect gradio#13639, via
        # `test_tab_overflow_control_has_an_accessible_name` in tests/e2e/test_browser_a11y.py.
        # Nothing about the page's default state changed -- the control still carries a `hide`
        # class (`display:none`) until the strip really overflows, and axe still skips
        # `display:none` subtrees, so every *other* scan in this module remains blind to it. The
        # test forces the strip narrow with `.tab-wrapper { max-width: 90px }` instead, which is
        # what actually mounts the control.
        #
        # The viewport recipe this comment used to carry was wrong for THIS app and is recorded
        # here so it is not tried again: at a 180px viewport `.tab-wrapper` still measures
        # scrollWidth == clientWidth == 442, because the app's own layout floor holds the strip far
        # wider than the 161px the two tabs need. It was measured on a bare two-tab Blocks, which
        # has no such floor, and does not transfer.
        #
        # Measured directly against real gradio wheels, so the >=6.21 floor is evidenced at its
        # exact boundary rather than inferred: with the strip forced narrow, the control renders on
        # all three, and 6.20.0 -> aria-label null (critical `button-name`), 6.21.0 -> "More tabs",
        # 6.22.0 -> "More tabs".
        run: >-
          pytest tests/e2e -m browser -q -rs
          --browser chromium
          --tracing retain-on-failure
          --video retain-on-failure
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-gradio-floor
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
