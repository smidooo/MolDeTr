name: Security

# `.github/SECURITY.md` documents a trust boundary and a reporting address, and until now nothing
# automated backed any of it. Two of its claims are now checked elsewhere -- `tests/test_checkpoint_trust.py`
# enforces the `weights_only` gate, and GitHub's secret scanning (already enabled on this repository,
# with push protection) backs "no credentials are committed". This workflow adds the two remaining
# pieces: static analysis of the code, and a look at the dependency tree.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Wednesday, deliberately offset from the Monday integrations and dependabot runs so a quiet week
    # does not produce one morning with three separate red mails.
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # to upload findings to the Security tab
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # `security-and-quality` over the default `security-extended`: this is research code with a
          # frozen training half, and the quality queries surface the kind of thing worth knowing
          # about the *live* half (the GUI, the CLI, the inference path) without a build step, since
          # Python needs none.
          queries: security-and-quality
      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOT on pull_request: this reaches PyPI's advisory database, and the `network` marker convention
    # established in integrations.yml keeps network-dependent checks out of PR lanes. A PR should
    # never go red because an advisory landed while it was open.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the audited environment
        # The full app+eval surface, because auditing a subset would report a clean tree while the
        # documented install pulls more than was scanned.
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,app,eval]"
      - name: Audit
        # PROMOTED TO A BASELINE RATCHET 2026-08-27 -- this step can fail the job now. It could not
        # before: read on for why, and for why it is written the way it is.
        #
        # `--strict` WAS HERE AND AUDITED NOTHING. Measured 2026-08-08, from the one run this lane
        # had had up to that point (it is gated off `pull_request`, so only a push to main or the
        # Wednesday cron reaches it): the audit died 1.7 s in with
        #     ERROR:pip_audit._cli:moldetr: Dependency not found on PyPI and could not be audited
        # No vulnerability table was printed, and `continue-on-error` turned that into a green job --
        # a guard reporting success while performing none of its work, the exact defect #43 fixed in
        # the rot watcher.
        #
        # `--skip-editable` alone does NOT rescue `--strict`, which is the trap here. Read off
        # pip-audit's source rather than assumed: the flag does not drop the distribution, it yields
        # a `SkippedDependency(skip_reason="distribution marked as editable")`
        # (`_dependency_source/pip.py`), and `--strict` calls `_fatal()` on *any* skip whatever its
        # reason (`_cli.py`). So `--strict --skip-editable` still exits before the table, only with a
        # different message.
        #
        # This project installs itself with `pip install -e`, so it always has at least one skipped
        # dependency. `--strict` therefore cannot mean "a stricter audit" here; it can only mean "no
        # audit". Dropping it is the fix; `--skip-editable` just keeps the output free of a warning
        # about a non-problem. Both pinned by tests/test_security_workflow.py.
        #
        # NOISE FLOOR MEASURED 2026-08-27: four non-`pull_request` runs since (32900395452,
        # 32901672474, 32933744669, 32936796469) all report the identical
        # `setuptools 79.0.1 PYSEC-2026-3447` -- a stable, single-package floor, and it is the
        # runner's own build toolchain (`pip install --upgrade pip pip-audit` above), not anything
        # this project declares. That measurement lives in `.github/pip-audit-baseline.json`, not
        # here, so it can be reviewed and dated independently of this file.
        #
        # Plain `pip-audit` (no `--strict`) exits 1 whenever ANY vulnerability is found, known or
        # not -- that is not an error, it is the normal signal `scripts/pip_audit_ratchet.py` below
        # needs to see. So this step tolerates a nonzero exit, but does NOT blanket-swallow it: a
        # `pip-audit` invocation can also exit 1 on a genuine internal failure (a `_fatal()` call, a
        # network error reaching the advisory service), and swallowing that would recreate the exact
        # defect this promotion exists to fix, just one layer down. The discriminator is the output,
        # not the exit code: `--format json` always produces a JSON object with a `dependencies` key
        # on the two real paths (clean or found-vulnerabilities) -- verified against
        # `pip_audit/_format/json.py` 2.10.1 -- and never reaches that formatter on a fatal path. So
        # "valid JSON with a dependencies key" is treated as "the audit ran", and anything else is a
        # real failure of the tool, reported as such rather than silently passed through.
        env:
          # Passed as an env var and read via `os.environ`, not interpolated into the Python source
          # below: embedding an arbitrary path into a string literal is exactly the kind of fragile
          # construct this project's own conventions warn against (a backslash in the path can form
          # an unintended escape sequence), and it costs nothing to avoid.
          AUDIT_JSON_PATH: ${{ runner.temp }}/pip-audit.json
        run: |
          set +e
          pip-audit --skip-editable --desc --format json > "$AUDIT_JSON_PATH"
          audit_status=$?
          set -e
          if ! python -c "
          import json, os, sys
          try:
              data = json.load(open(os.environ['AUDIT_JSON_PATH'], encoding='utf-8'))
          except Exception:
              sys.exit(1)
          sys.exit(0 if 'dependencies' in data else 1)
          "; then
            echo "::error::pip-audit exited ${audit_status} and did not produce parseable JSON with"
            echo "::error::a 'dependencies' key. Treating this as a real failure of the tool itself,"
            echo "::error::not as 'vulnerabilities found'. Raw output:"
            cat "$AUDIT_JSON_PATH" 2>/dev/null || echo "(no output file was written)"
            exit 1
          fi
          echo "pip-audit exit code: ${audit_status} (0 = clean, 1 = vulnerabilities found;"
          echo "scripts/pip_audit_ratchet.py below decides pass/fail against the baseline)"

      - name: Ratchet against the known-findings baseline
        # This is the step that can fail the job. See scripts/pip_audit_ratchet.py's docstring and
        # .github/pip-audit-baseline.json for what "known" means and how it was measured.
        env:
          AUDIT_JSON_PATH: ${{ runner.temp }}/pip-audit.json
        run: python scripts/pip_audit_ratchet.py "$AUDIT_JSON_PATH"

      - name: Summarise
        if: always()
        # So the result is legible from the run summary without opening logs.
        run: |
          echo "### pip-audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Per-advisory status is in the *Ratchet against the known-findings baseline* step" >> "$GITHUB_STEP_SUMMARY"
          echo "above: BASELINE (known, accepted), STALE (was baseline, no longer found -- consider" >> "$GITHUB_STEP_SUMMARY"
          echo "pruning), or NEW (fails the job). Add a reviewed, dated entry to" >> "$GITHUB_STEP_SUMMARY"
          echo "\`.github/pip-audit-baseline.json\` to accept a new finding; do not re-add" >> "$GITHUB_STEP_SUMMARY"
          echo "\`continue-on-error\` to make it go away." >> "$GITHUB_STEP_SUMMARY"

  # CodeQL going red is a finding, not an inconvenience, and nobody watches the Actions tab of a
  # paper companion between releases. `pip-audit` was report-only until 2026-08-27; it is now a
  # baseline ratchet (see the `dependency-audit` job above) and can fail this lane on a genuinely
  # new advisory, not only on infrastructure breakage.
  report-failure:
    name: announce a failed security lane
    needs: [codeql, dependency-audit]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/report-failure
        with:
          title: "Security lane is failing"
          guards: >-
            CodeQL static analysis and the `pip-audit` dependency scan, which fails on any advisory
            not already recorded in `.github/pip-audit-baseline.json`.
          token: ${{ github.token }}

  # This lane also has `schedule:` above and carries the identical 60-day silent-disable exposure
  # `nightly.yml` and `integrations.yml` document -- it just never said so.
  #
  # Restricted to `schedule` and `workflow_dispatch` specifically, NOT the broader
  # `!= 'pull_request'` that `dependency-audit` uses: this job's whole point is "the scheduled check
  # ran", and this workflow also triggers on `push: branches: [main]`. Every merged PR would
  # otherwise ping the switch too, resetting its timer on unrelated activity -- so a corrupted cron
  # expression or a silently disabled schedule would hide behind the next merge's push-triggered
  # run and never trip the alert. `workflow_dispatch` stays allowed as the documented manual
  # escape hatch for the schedule itself, matching how a human would re-run the check by hand.
  freshness-ping:
    name: report success to the freshness watch
    needs: [codeql, dependency-audit]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/heartbeat-ping
        with:
          url: ${{ secrets.HEALTHCHECK_URL_SECURITY }}
          label: "security (CodeQL + pip-audit)"
