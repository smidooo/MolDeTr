name: Integrations (external rot watch)

# The reason this repository has a testing overhaul at all: in August 2026 the README's DOI badge
# started rendering as `502 Invalid upstream response (429)` and *a user reported it*. Every check in
# `ci.yml` runs against the repository's own contents; nothing looked outward, so nothing could have
# caught it. This is the outward-looking half.
#
# NEVER runs on a pull request, and that is a design decision rather than an oversight. Publishers
# and CDNs have bad afternoons; a transient WAF 403 blocking an unrelated PR teaches people to
# override the check, and an overridden check is worse than no check. Weekly, plus manual dispatch,
# plus an issue on failure — so a real break is durable and visible without ever being in the way.
#
# `workflow_dispatch` is load-bearing for a second reason: GitHub disables scheduled workflows after
# 60 days without a *commit* (issues, PRs, releases and tags do not count), and a published paper's
# companion repo goes quiet by design. This job is the likeliest in the repo to be silently switched
# off, and it cannot detect that about itself — anything watching from inside GitHub dies with it.

on:
  schedule:
    # Monday 06:00 UTC. Weekly, not daily: these targets are archival (DOIs, Zenodo, HF) and change
    # on the scale of months. Daily polling would add noise and rate-limit exposure for no signal.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  release:
    # The one moment these targets DO change on a scale of minutes. Publishing a release mints a new
    # Zenodo version, and the `isSupplementTo` relation to the article does not carry over — absent
    # on every release since v0.1.0, six for six, most recently v1.4.0. Weekly alone would leave a
    # release unrelated to its own paper for up to six days, and the whole finding is that the
    # post-publish check is a missing automation rather than a checklist item somebody forgot.
    #
    # The cron stays, and not merely as a backstop: it is the only thing that catches a webhook that
    # succeeded here and was undone later, or a release whose minting failed after this run gave up.
    types: [published]

permissions:
  contents: read
  issues: write # to file the issue below; nothing else needs writing

jobs:
  external:
    name: DOIs, badges and weight mirrors
    runs-on: ubuntu-latest
    # 25, not 15. The release path adds a poll that can spend ~6.5 min waiting for Zenodo to mint,
    # on top of install + the network lane + a lychee sweep with `--max-retries 3`. A budget sized
    # for the pre-existing steps left that genuinely tight, and running out is worse than slow:
    # GitHub *cancels* a job that exceeds this, and `if: failure()` does not fire on cancellation --
    # so the issue-filer below, the delivery mechanism this whole workflow is built around, would
    # vanish exactly on the newly-added slow path. The filer's condition now covers cancellation
    # too, and this raise keeps that from being needed in the first place.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (no torch needed)
        # `tests/test_integrations.py` imports the standard library plus one first-party module,
        # `scripts/zenodo_add_paper_doi.py` — itself stdlib-only, and present because the checkout
        # is. Nothing here needs the heavy stack. `.[dev]` pulls torch via `moldetr[model]`, which
        # is why this installs pytest directly instead: a rot watcher that takes four minutes to
        # install PyTorch before making a dozen HTTP requests is one nobody will run by hand.
        #
        # That reasoning is right about the test module and wrong about the run. pytest loads
        # `tests/conftest.py` before collecting anything under `tests/`, and while that conftest
        # imported numpy and torch at module scope this job would have died at collection, run
        # none of its checks, and filed an issue blaming a missing module — caught before the
        # first cron fired, so it never actually happened. Keeping the install this thin is
        # therefore a live constraint on the conftest, not just a speed optimisation, and
        # `tests/test_integrations_isolation.py` is what holds the other end of it.
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Wait for Zenodo to mint the new version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        # Zenodo's release webhook is asynchronous — GitHub calls the release published well before
        # the new deposit exists. Without this wait, a release-triggered run resolves the concept
        # record to the PREVIOUS version, which does carry the paper relation, and passes green
        # while the release that just went out carries nothing. That vacuous pass is the precise
        # failure the guard exists to prevent, so the wait is part of the check, not a convenience.
        #
        # Exits 0 no matter how it ends, and deliberately: the pytest step below is the single
        # source of pass/fail. A timeout then surfaces as its own readable "Zenodo's newest record
        # is vX but the newest published release is vY" instead of an opaque step failure that says
        # nothing about which of the two is wrong.
        run: |
          python - <<'PY'
          import json, os, time, urllib.request

          tag = os.environ["RELEASE_TAG"]
          url = "https://zenodo.org/api/records/21214876"  # concept id -> newest version record
          deadline = time.time() + 6 * 60

          while True:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      version = json.load(response)["metadata"].get("version")
              except Exception as exc:
                  version = f"<unreachable: {exc}>"
              if version == tag:
                  print(f"Zenodo has minted {tag}")
                  break
              if time.time() >= deadline:
                  print(f"::warning::Zenodo still reports {version!r} after 6 min, expected {tag!r}")
                  break
              print(f"  Zenodo reports {version!r}, waiting for {tag!r} ...")
              time.sleep(30)
          PY

      - name: Check the paper relation
        id: paper_relation
        # Split out of the broad sweep below so the repair can be gated on THIS check alone. Gating
        # a `deposit:write` credential on "some network check failed" would let a rate-limited badge
        # or an unreachable weight mirror trigger a write to a published archival record.
        #
        # No `-m network` here, deliberately. Selecting by node id already picks exactly one test,
        # and the marker would add a way to select nothing: drop it and pytest exits 5, which
        # `continue-on-error` renders as `failure` — a vacuous detector that fires the repair.
        #
        # `continue-on-error` so the repair below can run; the job's red is restored further down.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: pytest tests/test_integrations.py::test_latest_software_record_supplements_the_article -q -p no:cacheprovider

      - name: Repair the paper relation
        id: repair
        # The relation has never survived a mint — absent on every release since v0.1.0. Repairing
        # it was a documented manual step for five releases running, which is the definition of a
        # missing automation rather than a checklist item somebody forgot.
        #
        # The event allowlist is positive, not `!= 'pull_request'`: if a trigger is ever added to
        # `on:`, the repair stays refused until someone names it here. The cron is included on
        # purpose — it is the only thing that can catch a relation *undone after* minting, and a
        # detector that refuses to fix what it found would reintroduce the manual step on the path
        # that most needs it. That the cron ever has to act is itself reportable; the issue filer
        # below says so.
        if: >-
          steps.paper_relation.outcome == 'failure' &&
          contains(fromJSON('["release", "schedule", "workflow_dispatch"]'), github.event_name)
        # Zenodo can hang. A step that runs long enough to breach the job's `timeout-minutes` gets
        # the job CANCELLED, and `if: failure()` does not fire on cancellation — so an unbounded
        # repair could take the issue filer down with it.
        timeout-minutes: 6
        env:
          # Step-scoped, never job-scoped: at job level this is exported into every step, including
          # the third-party `lychee-action` below. Named `ZENODO_DEPOSIT_TOKEN` rather than
          # `ZENODO_TOKEN` so it cannot be confused with the stale local variable of that name.
          ZENODO_DEPOSIT_TOKEN: ${{ secrets.ZENODO_DEPOSIT_TOKEN }}
          # Empty on the cron and dispatch paths, where there is no release to pin to and the
          # newest record genuinely is the right target.
          EXPECT_VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # `ran=false` by default, and the filer below keys on it rather than on this step's
          # outcome. Exiting 0 with no credential would otherwise read as `repair=success`, and the
          # filer would report a relation that was "removed and put back" when nothing was touched.
          echo "ran=false" >> "$GITHUB_OUTPUT"
          if [ -z "${ZENODO_DEPOSIT_TOKEN:-}" ]; then
            echo "::warning::no ZENODO_DEPOSIT_TOKEN secret is configured, so the relation cannot be repaired"
            exit 0
          fi
          token_file="$RUNNER_TEMP/zenodo.token"
          trap 'rm -f "$token_file"' EXIT
          # `umask` in a subshell, not `chmod` after the fact: redirection creates the file with the
          # default mode and only then would `chmod` narrow it, leaving a readable window.
          (umask 077; printf '%s' "$ZENODO_DEPOSIT_TOKEN" > "$token_file")
          # `--token-file`, not a flag carrying the value: argv is readable via `ps`. The script
          # prints only the token's length, never the token.
          #
          # `--expect-version` on the release path is what stops this editing the WRONG record. The
          # detector fails for four reasons and checks the version FIRST, so its failure often means
          # "Zenodo has not minted yet" -- and the wait step above deliberately gives up after six
          # minutes. Without this the fixer would resolve "newest under the concept id" to the
          # PREVIOUS release and unlock a published archival record that was never in question.
          python scripts/zenodo_add_paper_doi.py \
            --token-file "$token_file" \
            ${EXPECT_VERSION:+--expect-version "$EXPECT_VERSION"} \
            --confirm
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Re-check the paper relation
        id: reverify
        # The repair must be PROVEN, not assumed. `--confirm` exiting 0 says only that the fixer's
        # own read-back was happy; this re-answers the whole question, including the cross-check
        # that the record it edited is the one the newest published release minted.
        #
        # Gated on the DETECTOR, not on `steps.repair.outcome != 'skipped'`. A skipped step's
        # context entry is not reliably `'skipped'` — it can read as an empty string, which would
        # make that comparison true and run this on the happy path. Reading the detector says the
        # intended thing directly: re-check exactly when the first check failed. It also keeps the
        # terminal red correct if the repair is ever narrowed and stops running — an unrepaired
        # relation must not become a green tick.
        if: steps.paper_relation.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: pytest tests/test_integrations.py::test_latest_software_record_supplements_the_article -q -p no:cacheprovider

      - name: Check DOIs, badges and weight mirrors
        env:
          GH_TOKEN: ${{ github.token }}
        # The badge check needs a token only for the GitHub API rate limit; the repo is public.
        #
        # `-p no:cacheprovider` because nothing else here writes to the workspace and a stray
        # `.pytest_cache` in an otherwise read-only job is noise.
        #
        # `--deselect` because the paper relation is owned by the three steps above. Re-running it
        # here would report the PRE-repair state and contradict the re-verification that just passed.
        run: pytest tests/test_integrations.py -m network -q -rs -p no:cacheprovider --deselect tests/test_integrations.py::test_latest_software_record_supplements_the_article

      - name: Check documentation links
        # lychee for the bulk sweep — README and docs/ prose links, which are numerous, boring, and
        # exactly what a purpose-built checker is for. It is deliberately NOT asked to check DOIs:
        # no link checker understands DOI semantics, `doi.org` redirects to the publisher, and
        # `pubs.acs.org` answers automated clients with 403. Measured on this repo's own article DOI:
        # a plain GET through doi.org returns 403 while the Handle API reports responseCode 1. The
        # pytest step above owns DOIs for that reason; lychee owns everything else.
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,403,429
            --exclude 'https://doi\.org/'
            --exclude 'https://pubs\.acs\.org/'
            --exclude-path notebooks
            README.md 'docs/**/*.md'
          fail: true
        continue-on-error: true
        id: lychee

      - name: File an issue if anything rotted
        # `always() &&` is load-bearing: without it the step is implicitly gated on success, and
        # `failure()` alone is False when the job is CANCELLED -- which is exactly what GitHub does
        # on a `timeout-minutes` overrun. The one failure mode the release-path poll can introduce
        # is the one that would have silently removed the notification.
        #
        # The two relation clauses are load-bearing for the same reason, and were a live bug in the
        # first draft of this wiring. `failure()` is False when every failing step is
        # `continue-on-error` -- which the detector and the re-check both are -- so a relation that
        # could NOT be repaired would file nothing at all. The delivery mechanism this workflow is
        # built around would vanish for exactly the fault it exists to catch.
        #
        # The second clause reports a repair that ACTUALLY RAN outside a release. At mint time a
        # missing relation is expected, six for six, and needs no issue. Off the release path it
        # means something removed a relation from an already-published archival record, and
        # repairing that silently would erase the only evidence it happened.
        #
        # It keys on `outputs.ran`, not on the step's outcome. The step exits 0 when no credential
        # is configured, so `outcome == 'success'` there would report a record "removed and put
        # back" on every cron run of a repository that simply has no secret yet -- a paragraph of
        # confident fiction, weekly.
        if: >-
          always() && (
            failure() || cancelled() || steps.lychee.outcome == 'failure' ||
            (steps.paper_relation.outcome == 'failure' && steps.reverify.outcome != 'success') ||
            (steps.repair.outputs.ran == 'true' && github.event_name != 'release')
          )
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPAIR: ${{ steps.repair.outcome }}
          REPAIR_RAN: ${{ steps.repair.outputs.ran }}
          REVERIFY: ${{ steps.reverify.outcome }}
        # Going red is not enough on a weekly job in a quiet repo: nobody is watching the Actions tab
        # of a paper companion between releases. The issue is the delivery mechanism, and it is
        # deduplicated by title so a persistent outage does not open a new one every Monday.
        run: |
          title="External reference check failed"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body=$(printf '%s\n' \
            "The external-reference check failed ($GITHUB_EVENT_NAME): $RUN_URL" \
            "" \
            "This job watches things this repository cannot fix from inside itself — DOIs, README" \
            "badges as GitHub's camo proxy actually serves them, the Zenodo and Hugging Face weight" \
            "mirrors, documentation links, and whether the newest software deposit still relates" \
            "the article." \
            "" \
            "**The paper relation now repairs itself**, so if that is the failure here, the repair" \
            "already ran and did NOT close the gap (repair=\`$REPAIR\`, ran=\`$REPAIR_RAN\`," \
            "reverify=\`$REVERIFY\`). Four causes, in the order worth checking:" \
            "" \
            "1. **Zenodo has not minted the release yet.** The check asserts the record's version" \
            "   against the newest published release BEFORE it looks at the relation, so this" \
            "   failure is often about timing rather than metadata. The wait step gives up after" \
            "   six minutes by design. Nothing is wrong; re-run, or let Monday's cron catch it." \
            "2. No \`ZENODO_DEPOSIT_TOKEN\` secret (\`ran=false\` with no other error), or one that" \
            "   expired or lost a scope. A 403 on the very first GET is a stale token, not an" \
            "   outage." \
            "3. \`repair=skipped\` on a release — the event allowlist or the detector's gate is" \
            "   wrong; read the step conditions rather than re-running." \
            "4. Zenodo refused the PUT. If the log shows a discard that failed, check" \
            "   https://zenodo.org/me/uploads for a stranded draft before retrying." \
            "" \
            "Fallback, unchanged: \`python scripts/zenodo_add_paper_doi.py\` for a dry run, then" \
            "\`--confirm\`. docs/RELEASING.md has the background." \
            "" \
            "If instead \`ran=true\` and this was NOT a release, the relation was removed from an" \
            "already-published record and put back. Nothing in this repository can do that, so it" \
            "is worth understanding rather than closing. Note the job may be GREEN in that case:" \
            "the deposit is correct by the time this is filed, and the issue is the report, not a" \
            "failure. That is the one deliberate exception to this workflow's rule that a filed" \
            "issue and a green tick must not disagree." \
            "" \
            "Before assuming a real outage, note that the badge check is the one that caught the" \
            "original 2026-08 incident, where Zenodo rate-limited GitHub's shared camo IP pool. A" \
            "badge can be perfectly healthy from a laptop and broken for every visitor." \
            "" \
            "Closing this without a fix is reasonable if the cause was transient — the job reopens" \
            "one next Monday if it is not.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "commented on existing issue #$existing"
          else
            gh issue create --title "$title" --body "$body" --label "" || \
              gh issue create --title "$title" --body "$body"
          fi

      - name: Fail the job if the paper relation is still missing
        # Same argument as the lychee twin below, and the same shape. The detector and the re-check
        # are both `continue-on-error` so that the repair between them can run at all; without this
        # step the job ends GREEN over a published deposit that does not point at its own paper.
        #
        # `!= 'success'` rather than `== 'failure'` on purpose: the re-check is also `skipped` when
        # the repair never ran, and a skip here means the relation was never fixed.
        if: steps.paper_relation.outcome == 'failure' && steps.reverify.outcome != 'success'
        run: exit 1

      - name: Fail the job if the link sweep failed
        # `continue-on-error` above lets the issue get filed; the job must still end red, or the
        # Actions tab shows a green tick over a filed issue and the two disagree.
        if: steps.lychee.outcome == 'failure'
        run: exit 1

      - name: Report success to the freshness watch
        # No `if:` beyond the default: a step with none only runs if no prior step in this job has
        # FAILED (a skipped step, like the `release`-only Zenodo wait on a cron run, does not block
        # it -- see e.g. how "Verify the checkpoint" in nightly.yml runs regardless of whether the
        # cache-miss download above it ran or skipped). So this fires only when the two `exit 1`
        # guards above did not fire, i.e. a genuinely clean sweep.
        uses: ./.github/actions/heartbeat-ping
        with:
          url: ${{ secrets.HEALTHCHECK_URL_INTEGRATIONS }}
          label: "integrations (external rot watch)"
