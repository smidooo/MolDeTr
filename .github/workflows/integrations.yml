name: Integrations (external rot watch)

# The reason this repository has a testing overhaul at all: in August 2026 the README's DOI badge
# started rendering as `502 Invalid upstream response (429)` and *a user reported it*. Every check in
# `ci.yml` runs against the repository's own contents; nothing looked outward, so nothing could have
# caught it. This is the outward-looking half.
#
# NEVER runs on a pull request, and that is a design decision rather than an oversight. Publishers
# and CDNs have bad afternoons; a transient WAF 403 blocking an unrelated PR teaches people to
# override the check, and an overridden check is worse than no check. Weekly, plus manual dispatch,
# plus an issue on failure — so a real break is durable and visible without ever being in the way.
#
# `workflow_dispatch` is load-bearing for a second reason: GitHub disables scheduled workflows after
# 60 days without a *commit* (issues, PRs, releases and tags do not count), and a published paper's
# companion repo goes quiet by design. This job is the likeliest in the repo to be silently switched
# off, and it cannot detect that about itself — anything watching from inside GitHub dies with it.

on:
  schedule:
    # Monday 06:00 UTC. Weekly, not daily: these targets are archival (DOIs, Zenodo, HF) and change
    # on the scale of months. Daily polling would add noise and rate-limit exposure for no signal.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  release:
    # The one moment these targets DO change on a scale of minutes. Publishing a release mints a new
    # Zenodo version, and the `isSupplementTo` relation to the article does not carry over — absent
    # on every release since v0.1.0, four for four, most recently v1.3.0. Weekly alone would leave a
    # release unrelated to its own paper for up to six days, and the whole finding is that the
    # post-publish check is a missing automation rather than a checklist item somebody forgot.
    #
    # The cron stays, and not merely as a backstop: it is the only thing that catches a webhook that
    # succeeded here and was undone later, or a release whose minting failed after this run gave up.
    types: [published]

permissions:
  contents: read
  issues: write # to file the issue below; nothing else needs writing

jobs:
  external:
    name: DOIs, badges and weight mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (no torch needed)
        # `tests/test_integrations.py` imports the standard library plus one first-party module,
        # `scripts/zenodo_add_paper_doi.py` — itself stdlib-only, and present because the checkout
        # is. Nothing here needs the heavy stack. `.[dev]` pulls torch via `moldetr[model]`, which
        # is why this installs pytest directly instead: a rot watcher that takes four minutes to
        # install PyTorch before making a dozen HTTP requests is one nobody will run by hand.
        #
        # That reasoning is right about the test module and wrong about the run. pytest loads
        # `tests/conftest.py` before collecting anything under `tests/`, and while that conftest
        # imported numpy and torch at module scope this job would have died at collection, run
        # none of its checks, and filed an issue blaming a missing module — caught before the
        # first cron fired, so it never actually happened. Keeping the install this thin is
        # therefore a live constraint on the conftest, not just a speed optimisation, and
        # `tests/test_integrations_isolation.py` is what holds the other end of it.
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Wait for Zenodo to mint the new version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        # Zenodo's release webhook is asynchronous — GitHub calls the release published well before
        # the new deposit exists. Without this wait, a release-triggered run resolves the concept
        # record to the PREVIOUS version, which does carry the paper relation, and passes green
        # while the release that just went out carries nothing. That vacuous pass is the precise
        # failure the guard exists to prevent, so the wait is part of the check, not a convenience.
        #
        # Exits 0 no matter how it ends, and deliberately: the pytest step below is the single
        # source of pass/fail. A timeout then surfaces as its own readable "Zenodo's newest record
        # is vX but the newest published release is vY" instead of an opaque step failure that says
        # nothing about which of the two is wrong.
        run: |
          python - <<'PY'
          import json, os, time, urllib.request

          tag = os.environ["RELEASE_TAG"]
          url = "https://zenodo.org/api/records/21214876"  # concept id -> newest version record
          deadline = time.time() + 6 * 60

          while True:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      version = json.load(response)["metadata"].get("version")
              except Exception as exc:
                  version = f"<unreachable: {exc}>"
              if version == tag:
                  print(f"Zenodo has minted {tag}")
                  break
              if time.time() >= deadline:
                  print(f"::warning::Zenodo still reports {version!r} after 6 min, expected {tag!r}")
                  break
              print(f"  Zenodo reports {version!r}, waiting for {tag!r} ...")
              time.sleep(30)
          PY

      - name: Check DOIs, badges and weight mirrors
        env:
          GH_TOKEN: ${{ github.token }}
        # The badge check needs a token only for the GitHub API rate limit; the repo is public.
        #
        # `-p no:cacheprovider` because nothing else here writes to the workspace and a stray
        # `.pytest_cache` in an otherwise read-only job is noise.
        run: pytest tests/test_integrations.py -m network -q -rs -p no:cacheprovider

      - name: Check documentation links
        # lychee for the bulk sweep — README and docs/ prose links, which are numerous, boring, and
        # exactly what a purpose-built checker is for. It is deliberately NOT asked to check DOIs:
        # no link checker understands DOI semantics, `doi.org` redirects to the publisher, and
        # `pubs.acs.org` answers automated clients with 403. Measured on this repo's own article DOI:
        # a plain GET through doi.org returns 403 while the Handle API reports responseCode 1. The
        # pytest step above owns DOIs for that reason; lychee owns everything else.
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,403,429
            --exclude 'https://doi\.org/'
            --exclude 'https://pubs\.acs\.org/'
            --exclude-path notebooks
            README.md 'docs/**/*.md'
          fail: true
        continue-on-error: true
        id: lychee

      - name: File an issue if anything rotted
        if: failure() || steps.lychee.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Going red is not enough on a weekly job in a quiet repo: nobody is watching the Actions tab
        # of a paper companion between releases. The issue is the delivery mechanism, and it is
        # deduplicated by title so a persistent outage does not open a new one every Monday.
        run: |
          title="External reference check failed"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body=$(printf '%s\n' \
            "The weekly external-reference check failed: $RUN_URL" \
            "" \
            "This job watches things this repository cannot fix from inside itself — DOIs, README" \
            "badges as GitHub's camo proxy actually serves them, the Zenodo and Hugging Face weight" \
            "mirrors, documentation links, and whether the newest software deposit still relates" \
            "the article." \
            "" \
            "If the failure is the paper relation, the fix is one command and needs a Zenodo token:" \
            "\`python scripts/zenodo_add_paper_doi.py\` for a dry run, then \`--confirm\`. It has" \
            "been missing on every release since v0.1.0, so treat it as expected rather than odd;" \
            "docs/RELEASING.md has the background." \
            "" \
            "Before assuming a real outage, note that the badge check is the one that caught the" \
            "original 2026-08 incident, where Zenodo rate-limited GitHub's shared camo IP pool. A" \
            "badge can be perfectly healthy from a laptop and broken for every visitor." \
            "" \
            "Closing this without a fix is reasonable if the cause was transient — the job reopens" \
            "one next Monday if it is not.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "commented on existing issue #$existing"
          else
            gh issue create --title "$title" --body "$body" --label "" || \
              gh issue create --title "$title" --body "$body"
          fi

      - name: Fail the job if the link sweep failed
        # `continue-on-error` above lets the issue get filed; the job must still end red, or the
        # Actions tab shows a green tick over a filed issue and the two disagree.
        if: steps.lychee.outcome == 'failure'
        run: exit 1
