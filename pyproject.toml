[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moldetr"
version = "1.3.0"
description = "1D Deformable DETR for automated detection of NMR multiplets in 1H spectra (MolDeTr)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicolas Schmid" }]
keywords = ["NMR", "multiplet detection", "deformable DETR", "deep learning", "spectroscopy"]
# One `Programming Language :: Python :: 3.X` entry per interpreter the CI matrix actually runs, no
# more and no fewer — `tests/test_public_api.py` asserts the two agree in both directions. 3.11 was
# tested for a long time without being advertised, so a supported interpreter was invisible on the
# package page and to PyPI's version filter. The reverse (advertising an untested version) is the
# more dangerous half: that is how `gradio>=6.21` became a claim about a version CI never installed.
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

# Core runtime dependencies (imported by the moldetr package itself).
# Loosely pinned for portability; see deploy/requirements-lock-linux64.txt for
# the exact CUDA-11.7 conda environment used to train the released checkpoint.
dependencies = [
    "hydra-core>=1.2",
    "omegaconf>=2.2",
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "multipledispatch>=0.6",
    "adjustText>=1.0",  # moldetr.visualization de-conflicts multiplet labels on every detection
]

[project.optional-dependencies]
# The deep-learning stack. Everything that loads the checkpoint or runs the network needs it:
# moldetr.inference, .model, .learner, .loss, .matcher, .metrics and the two torch-backed
# dataloader modules. The spin-physics half (moldetr.simulate, moldetr.distort) is pure
# NumPy/SciPy and deliberately does NOT, so downstream simulation code can install this package
# without pulling several hundred megabytes it will never call. Asserted in tests/test_public_api.py.
model = [
    "torch>=1.13",
    "fastai>=2.7,<2.8",  # fastai 2.8.x + fastcore 2.x drops L.starmap -> learner.load() crashes; 2.7.x pins fastcore<2
]
# Extra deps used only by the evaluation / plotting scripts in scripts/.
eval = [
    "moldetr[model]",  # evaluate_synthetic.py loads the checkpoint, so it needs the network
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "seaborn>=0.12",
    "cmcrameri>=1.5",
]
app = [
    "moldetr[model]",  # the GUI runs inference, so it needs the network
    # Floor is 6.21, not 6.0: gradio's icon-only tab-overflow button shipped with no accessible
    # name until gradio-app/gradio#13639 (released in 6.21.0), which axe reports as a critical
    # `button-name` violation on our own Simulate tab. CI installs unconstrained and so has picked
    # the fix up incidentally since 2026-07-29 -- this makes it a guarantee. The floor itself is
    # exercised by the `gradio-floor` job in ci.yml, which pins `gradio==6.21.0` in the same
    # resolution as the extras -- the lesson `[tool.mypy]` below records for numpy, applied here.
    # Necessity is now measured rather than argued: with the tab strip forced narrow, the overflow
    # control renders on 6.20.0 with NO accessible name and on 6.21.0 as "More tabs" (probed
    # against the real wheels). `test_tab_overflow_control_has_an_accessible_name` asserts it, so
    # lowering this floor turns the suite red instead of silently reintroducing the defect.
    # Note what CI does and does not do: it never installs 6.20.0, so it re-proves the fix is
    # PRESENT at the pinned floor, not that 6.20 fails -- that half is the out-of-band measurement
    # above.
    "gradio>=6.21,<7",
    "plotly>=5",  # interactive spectrum in the Gradio GUI (plotting.spectrum_figure)
]
dev = [
    "moldetr[model]",  # the suite exercises the network (tests/conftest.py imports torch)
    "pytest>=7.0",
    "pytest-cov>=5.0",  # coverage: `pytest --cov=app --cov=app_ui --cov=moldetr`
    "ruff>=0.1",
    "mypy>=1.0",
    "hypothesis>=6.0",  # property-based tests (tests/test_properties.py)
    # tests/test_public_api.py reads pyproject.toml to assert the packaging contract. `tomllib` is
    # 3.11+ and this package supports 3.10, so the backport keeps that coverage on the oldest
    # supported interpreter instead of skipping it exactly where a packaging slip is likeliest.
    "tomli>=2.0; python_version < '3.11'",
]
# Opt-in Playwright browser e2e (tests/e2e/, run with `-m browser`; needs `playwright install chromium`).
browser = [
    "pytest-playwright>=0.5",
    "axe-playwright-python>=0.1.8",  # accessibility scan in the browser tier
]
# Execute the released Colab notebooks end-to-end: `pytest --nbmake notebooks/*.ipynb`. Opt-in — the
# notebooks download the ~974 MB checkpoint, so this runs locally / nightly, never in the fast CI lane.
notebooks = [
    "nbmake>=1.5",
]

[project.urls]
Homepage = "https://github.com/smidooo/MolDeTr"
Paper = "https://doi.org/10.1021/acs.analchem.5c03465"
Software = "https://doi.org/10.5281/zenodo.21214876"
Data = "https://doi.org/10.5281/zenodo.21217101"

[project.scripts]
moldetr = "moldetr.cli:main"

[tool.setuptools]
# Without this, only LICENSE reaches the wheel: THIRD_PARTY.md sits at the repo root, so it is
# neither package-data nor picked up by the default license-file globs. A third-party notice that
# reaches only people browsing the repository does not reach the people who install the package.
license-files = ["LICENSE", "THIRD_PARTY.md"]

[tool.setuptools.packages.find]
include = ["moldetr*"]

[tool.setuptools.package-data]
# PEP 561: without this marker, type checkers treat the installed package as untyped and every
# downstream needs an `ignore_missing_imports` override, which hides real errors alongside the noise.
"moldetr" = ["py.typed"]
# Ship the deformable-attention op sources so the CUDA extension can be built.
"moldetr.model.ops" = [
    "make.sh",
    "src/*.h",
    "src/*.cpp",
    "src/cpu/*",
    "src/cuda/*",
]

[tool.mypy]
# `py.typed` tells every downstream type checker to trust this package's annotations, and until now
# nothing verified them: there was no mypy config and no CI step. This gate closes part of that.
#
# It is deliberately NARROWER than py.typed promises, and saying so is the point. Strict checking
# of the whole package is 381 errors, concentrated in the torch/fastai-facing modules where the
# untyped dependencies make `Any` unavoidable; exempting one surfaces the next. Gated here is the
# pure-NumPy half -- the surface a private downstream consumer actually imports, and the one whose
# annotations a downstream can act on. The rest remains unverified; that is a known gap, not a
# claim of coverage.
#
# Gated: simulate.py, distort.py, validation.py. Deliberately NOT gated, each checked and each
# left out for a stated reason rather than forgotten:
#   labels.py (10 errors), postprocess.py (11), config.py (8) -- never annotated at all; adding
#     them is annotation work, not a config change, and doing it under the same commit that
#     widens the gate would hide one in the other.
#   reproducibility.py -- imports torch, so it cannot be checked against the dependency floor
#     without the whole model extra. Its one non-import error is numpy stub typing, not a defect:
#     `np.random.get_state()` is declared to return `dict[str, Any]` but returns the legacy tuple
#     at runtime, which is what line 40 indexes.
#   plotstyle.py -- matplotlib-facing, same `Any` problem as the torch modules.
#
# Every candidate is verified against the FLOOR, not against what happens to be installed:
# python 3.10 with numpy 2.2.6 (what CI resolves for its oldest leg) *and* 3.12 with numpy 2.5.1.
# Checking only the newest numpy is what shipped a py.typed contract that was wrong for this
# package's own declared `numpy>=1.23` -- see the v1.1.0 CI failure where every 3.10 leg went red
# on `Missing type arguments for generic type "ndarray"` while every 3.11 leg passed.
strict = true
files = ["moldetr/simulate.py", "moldetr/distort.py", "moldetr/validation.py"]

[[tool.mypy.overrides]]
# Reached as an import from moldetr.distort. It is the training-era augmentation pipeline, kept as
# historical evidence and excluded from `ruff format` for the same reason; annotating it would
# rewrite the file this repository preserves for provenance comparison.
module = "moldetr.dataloader.data_augmentation"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Research code: keep the gate light. Focus on real errors, not style churn.
select = ["E", "F", "W"]
ignore = ["E501", "E741", "W605", "E402", "F403", "F405", "E731", "E722", "F811", "F841"]

[tool.ruff.format]
# `ruff format --check` runs in CI, so this exclude list is what makes that gate addable at all:
# measured 2026-08-07, 24 files would otherwise be reformatted and the lint job would be red on
# arrival. 18 of those 24 are the frozen training stack listed below — the same modules the coverage
# run finds at 0–45 %, which is not a coincidence: neither half is actively developed.
#
# The augmentation pipeline is the strongest case and the reason this list exists. It is historical
# evidence, not live code to tidy — the public twin of the private repo's
# `ds/dataloader/data_augumentation.py`, and the provenance work that dates the shipped weights reads
# the two side by side. `ruff format` would rewrite ~270 lines of it and destroy that correspondence
# for no behavioural gain. The same argument holds, more weakly but still, for the model/loss/learner
# code whose shape must keep matching a frozen checkpoint, and for `scripts/train.py`.
#
# Excluding *cosmetics* on frozen code costs nothing. Note this is the opposite call from coverage,
# where these same modules are deliberately NOT omitted: omitting them there would hide untested
# behaviour, which is how you stop noticing. Formatting hides nothing.
#
# Editors that name a file explicitly still need `--force-exclude` to honour this — which is why the
# PostToolUse ruff hook rewrites these files anyway on edit. Put notes in Markdown, not in them.
exclude = [
    "moldetr/dataloader/**",
    "moldetr/learner/**",
    "moldetr/loss/**",
    "moldetr/model/**",
    "scripts/train.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Markers keep the heavy/opt-in suites out of the default run. `model` needs the 974 MB checkpoint
# (local only); `browser` needs `playwright install` (opt-in); `e2e` launches an in-process Gradio app.
#
# Every marker here is applied to at least one test, and `tests/test_marker_hygiene.py` keeps it that
# way. `data`, `slow` and `network` used to be declared and applied to nothing, which made the CI
# lanes' `-m "... and not network"` read as a deliberate exclusion while excluding the empty set.
# Declare a marker when a test carries it, not in anticipation — an aspirational marker is
# indistinguishable from a working one right up until it matters.
markers = [
    "unit: fast, weight-free unit test (a subset; CI runs `-m 'not e2e and not browser and not network'`)",
    "e2e: in-process gradio_client end-to-end test (needs the .[app] extra)",
    "browser: Playwright browser test (opt-in; needs `playwright install`)",
    "model: requires the real 974 MB checkpoint (local only)",
    # Returned 2026-08-08 WITH tests, having been deleted in #35 for having none.
    # `tests/test_integrations.py` checks DOIs, badges through camo, and the weight mirrors — the
    # outward-looking half that nothing covered when the DOI badge broke and a user had to report it.
    # Run weekly by `.github/workflows/integrations.yml`, never on a PR: a publisher WAF having a bad
    # afternoon must not block unrelated work, because a check that blocks unrelated work gets ignored.
    "network: reaches the public internet; excluded from every PR lane, run weekly",
]

[tool.coverage.run]
source = ["moldetr", "app", "app_ui"]
# `ops/setup.py` is a setuptools build script for the CUDA extension, not application code — 30
# statements that can never execute under pytest. Nothing else is omitted, deliberately: see below.
omit = ["*/model/ops/setup.py"]

[tool.coverage.report]
# `fail_under` is intentionally NOT set here, only on the CI command line (`--cov-fail-under`).
# Setting it in config would make any local subset run (`pytest tests/test_foo.py --cov`) fail for
# reporting low coverage of everything it did not run, which trains people to pass `--no-cov`.
#
# The CI floor is 78, one point under the 79 % measured on 2026-08-07 (2659 statements, 571 missed,
# with the omit above). Ratcheted against the real number rather than an aspirational target: a floor
# nobody currently meets gets deleted the first time it blocks a PR.
#
# Read the composition before acting on the headline. The shortfall is almost entirely the *training*
# stack, which CI structurally cannot exercise — no GPU, no training corpus, checkpoint frozen:
# `dataloader/dataloader.py` 34 %, `learner/multi_multiplet_learner.py` 0 %,
# `dataloader/data_augmentation.py` 45 %, `loss/individual_losses.py` 43 %, `loss/combined_loss.py`
# 0 % — roughly 430 of the 571 between them. The user-facing path is in good shape: `app.py` 93 %,
# `postprocess` and `validation` 100 %, `simulate` 97 %, `visualization` 96 %.
#
# So do NOT chase this number by writing tests for frozen training code — that is textbook weak
# tests-for-coverage's-sake, and the code cannot change without invalidating the published
# checkpoint. And do NOT omit those modules to make the figure look better either: omitting is how
# you stop noticing. They stay counted, the floor stays where the real number is, and the gap is
# documented here instead.
show_missing = true
